<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam Shelffo-McGrath</title>

  <style>

    /* FONTS */

    @font-face {
      font-family: "Bulky";
      src: url("./bulky.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Aboensis";
      src: url("./Aboensis-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "WonderType";
      src: url("./WonderType-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "xxQueen";
      src: url("./xxQueen-basic.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Goozette";
      src: url("./goozette.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "FifteenTwenty";
      src: url("./FifteenTwenty-DemiOblique.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }


    /* GENERAL */

    * {
      box-sizing: border-box;
    }

    html {
      background: #FAF4DC;
    }

    body {
      margin: 0;
      background: #FAF4DC;
      color: #171717;
      font-family: "WonderType", Arial, sans-serif;
    }


    /* HEADER IMAGE */

    .header-image {
      display: block;
      width: 100%;
      height: auto;

      /* Tiny strip of background above image */
      margin-top: 6px;
    }


    /* MAIN CONTENT */

    main {
      width: min(90%, 900px);
      margin: 0 auto;

      /* Extra bottom space prevents content
         from disappearing behind fixed title */
      padding: 55px 0 150px;
    }


    /* NAME */

    h1 {
      font-family: "Bulky", Arial, sans-serif;
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: normal;
      line-height: 1;
      margin: 0;

      position: fixed;
      left: 30px;
      bottom: 25px;
      z-index: 10;

      /* Outline */
      color: transparent;
      -webkit-text-stroke: 1.5px #171717;

      transition: color 0.2s ease;
    }

    h1:hover {
      color: #171717;
    }


    /* PROJECTS */

    .projects {
      border-top: 1px solid #171717;
      margin-bottom: 110px;
    }

    details {
      border-bottom: 1px solid #171717;
    }

    summary {
      list-style: none;
      cursor: pointer;

      padding: 17px 0;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      font-size: 25px;
    }

    summary::-webkit-details-marker {
      display: none;
    }


    /* PROJECT TITLE */

    .project-title {
      position: relative;
      display: inline-block;
    
      font-family: "WonderType", Arial, sans-serif;
      color: #171717;
    
      transition: color 0.2s ease;
    }


    /* ACCENT LAYER */

    .project-title::before {
      content: attr(data-text);
    
      position: absolute;
      left: -15px;
      top: 2px;
    
      font-family: "Aboensis", sans-serif;
      font-size: 1.35em;
      line-height: 1;
    
      color: #FFFFFF;
      -webkit-text-stroke: 0.7px #FFFFFF;
    
      white-space: nowrap;
      pointer-events: none;
    
      /* Tilt upward toward the right */
      transform: rotate(-8deg);
      transform-origin: left center;
    
      /* Normally behind WonderType */
      z-index: -1;
    
      transition:
        color 0.2s ease,
        -webkit-text-stroke 0.2s ease,
        transform 0.2s ease;
    }
    
    
    /* HOVER */
    
    /* WonderType turns white */
    summary:hover .project-title {
      color: #FFFFFF;
    }
    
    /* Accent becomes black and comes forward */
    summary:hover .project-title::before {
      color: #171717;
      -webkit-text-stroke: 0.7px #171717;
    
      z-index: 2;
    
      transform: rotate(-8deg);
    }


    /* PLUS / MINUS */

    summary::after {
      content: "+";
      font-size: 20px;
      font-weight: 300;
      flex-shrink: 0;
    }

    details[open] summary::after {
      content: "−";
    }


    /* PROJECT BODY */

    .project-content {
      max-width: 650px;
      padding: 5px 0 28px;

      font-size: 14px;
      line-height: 1.6;
    }

    .project-content p {
      margin: 0;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      .header-image {
        width: 100%;
        height: auto;
        margin-top: 6px;
      }

      main {
        padding-top: 38px;
        padding-bottom: 130px;
      }

      h1 {
        left: 20px;
        bottom: 20px;
        font-size: clamp(26px, 8vw, 40px);
      }

      .projects {
        margin-bottom: 90px;
      }

      summary {
        font-size: 22px;
      }

      .project-title::before {
        left: 4px;
        top: 2px;
        font-size: 1.3em;
      }
    }

  </style>
</head>

<body>

  <img
    class="header-image"
    src="header.png"
    alt=""
  >

  <main>

    <h1>Sam Shelffo-McGrath</h1>

    <div class="projects">

      <details>
        <summary>
          <span
            class="project-title"
            data-text="Work"
          >Work</span>
        </summary>

        <div class="project-content">
          <p>
            Short description of the project goes here.
          </p>
        </div>
      </details>


      <details>
        <summary>
          <span
            class="project-title"
            data-text="Projects"
          >Projects</span>
        </summary>

        <div class="project-content">
          <p>
            Short description of the project goes here.
          </p>
        </div>
      </details>


      <details>
        <summary>
          <span
            class="project-title"
            data-text="CV"
          >CV</span>
        </summary>

        <div class="project-content">
          <p>
            Short description of the project goes here.
          </p>
        </div>
      </details>

    </div>

  </main>

</body>
</html>
