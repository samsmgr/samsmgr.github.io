<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam Shelffo-McGrath</title>

  <style>

    @font-face {
    font-family: "Bulky";
    src: url("./bulky.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #FAF4DC;
    }

    body {
      margin: 0;
      background: #FAF4DC;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* THIN IMAGE HEADER */
    .header-image {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }

    /* MAIN CONTENT */
    main {
      width: min(90%, 900px);
      margin: 0 auto;
      padding: 55px 0 100px;
    }

    h1 {
    font-family: "Bulky", Arial, sans-serif;
    font-size: clamp(42px, 7vw, 82px);
    font-weight: normal;
    line-height: 1;
    margin: 0;
  
    position: fixed;
    left: 30px;
    bottom: 25px;
    z-index: 10;
  }

    /* PROJECTS */
    .projects {
      border-top: 1px solid #171717;
    }

    details {
      border-bottom: 1px solid #171717;
    }

    summary {
      list-style: none;
      cursor: pointer;
      padding: 17px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 15px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";
      font-size: 20px;
      font-weight: 300;
    }

    details[open] summary::after {
      content: "−";
    }

    .project-content {
      max-width: 650px;
      padding: 5px 0 28px;
      font-size: 14px;
      line-height: 1.6;
    }

    .project-content p {
      margin: 0;
    }

    @media (max-width: 600px) {
      .header-image {
        height: 85px;
      }

      main {
        padding-top: 38px;
      }

      h1 {
        margin-bottom: 50px;
      }
    }
  </style>
</head>

<body>

  <!-- Replace header.jpg with your image -->
  <img
    class="header-image"
    src="header.png"
    alt=""
  >

  <main>

    <h1>Sam Shelffo-McGrath</h1>

    <div class="projects">

      <details>
        <summary>Project One</summary>
        <div class="project-content">
          <p>
            Short description of the project goes here.
          </p>
        </div>
      </details>

      <details>
        <summary>Project Two</summary>
        <div class="project-content">
          <p>
            Short description of the project goes here.
          </p>
        </div>
      </details>

      <details>
        <summary>Project Three</summary>
        <div class="project-content">
          <p>
            Short description of the project goes here.
          </p>
        </div>
      </details>

      <details>
        <summary>Project Four</summary>
        <div class="project-content">
          <p>
            Short description of the project goes here.
          </p>
        </div>
      </details>

    </div>

  </main>

</body>
</html>
